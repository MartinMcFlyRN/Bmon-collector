# --- Opzione A: il collector nuovo riceve direttamente il traffico -----------
upstream bmon_collector {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name collector.example.it;

    ssl_certificate     /etc/letsencrypt/live/collector.example.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/collector.example.it/privkey.pem;

    client_max_body_size 16m;

    location = /collector {
        proxy_pass http://bmon_collector;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://bmon_collector;
    }

    location / { return 404; }
}

